workflows:
  android-release:
    name: MacroLens - Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
    
      flutter: stable  # Forces Codemagic to preinstall the Flutter framework tools
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
      groups:
        - android_signing
    scripts:
      - name: Install dependencies
        script: |
          pip install --upgrade pip
          pip install --upgrade flet
          pip install -r requirements.txt
      - name: Build Android App Bundle (.aab, for Play Store)
        script: |
          flet build aab \
            --android-permissions android.permission.CAMERA=true \
            --android-permissions android.permission.RECORD_AUDIO=true \
            main.py
      - name: Build Android APK (.apk, for direct install/testing)
        script: |
          flet build apk \
            --android-permissions android.permission.CAMERA=true \
            --android-permissions android.permission.RECORD_AUDIO=true \
            main.py
    artifacts:
      - build/aab/*.aab
      - build/apk/*.apk
    publishing:
      email:
        recipients:
          - adityamahat743@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: MacroLens - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
    
      flutter: stable  # Sets up Flutter on the macOS build environment
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.macrolens
      groups:
        - appstore_credentials
    scripts:
      - name: Install dependencies
        script: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build iOS package
        script: |
          flet build ipa \
            --info-plist NSCameraUsageDescription="MacroLens needs your camera to scan meals." \
            main.py
    artifacts:
      - build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true