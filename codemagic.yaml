workflows:
  android-release:
    name: MacroLens - Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      python: 3.12
      vars:
        # Set the real value as a secure/encrypted variable in the Codemagic UI,
        # not here in plain text.
        GEMINI_API_KEY: $GEMINI_API_KEY
      groups:
        - android_signing   # holds CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
    scripts:
      - name: Install Flutter deps for Flet
        script: |
          pip install --upgrade flet
      - name: Install project requirements
        script: pip install -r requirements.txt
      - name: Build Android App Bundle
        script: |
          flet build appbundle \
            --android-permissions android.permission.CAMERA=true \
            --android-permissions android.permission.RECORD_AUDIO=true \
            --build-number=$(($PROJECT_BUILD_NUMBER)) \
            main.py
    artifacts:
      - build/appbundle/**/*.aab
      - build/apk/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-release:
    name: MacroLens - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      python: 3.12
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.macrolens
      groups:
        - appstore_credentials   # holds App Store Connect API key
    scripts:
      - name: Install project requirements
        script: pip install -r requirements.txt
      - name: Build iOS package
        script: |
          flet build ipa \
            --info-plist NSCameraUsageDescription="MacroLens needs your camera to scan meals." \
            main.py
    artifacts:
      - build/ipa/**/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true