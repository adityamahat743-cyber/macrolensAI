workflows:
  ios-release:
    name: MacroLens - iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
    scripts:
      - name: Install dependencies
        script: |
          python3 -m pip install --upgrade pip
          pip3 install --upgrade flet
          pip3 install -r requirements.txt
      - name: Build iOS Package
        script: |
          # Compiles your Python folder into an iOS package without App Store publishing locks
          yes y | flet build ipa . --info-plist NSCameraUsageDescription="MacroLens needs your camera to scan meals."
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - adityamahat743@gmail.com
        notify:
          success: true
          failure: true

