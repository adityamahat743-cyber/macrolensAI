workflows:
  android-release:
    name: MacroLens - Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
      groups:
        - android_signing
    scripts:
      - name: Install dependencies
        script: |
          pip install --upgrade pip
          pip install --upgrade flet
          pip install -r requirements.txt
      - name: Pre-build project cleanup
        script: |
          # Explicitly force flutter config initialization inside the builder container
          flutter config --no-analytics
          flutter doctor
      - name: Build Android App Package
        script: |
          # Switch target execution to build an inline standalone APK layout format directly
          flet build apk \
            --android-permissions android.permission.CAMERA=true \
            --android-permissions android.permission.RECORD_AUDIO=true \
            main.py
    artifacts:
      - build/apk/*.apk
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - adityamahat743@gmail.com
        notify:
          success: true
          failure: true
