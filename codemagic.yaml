workflows:
  android-release:
    name: MacroLens - Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
    scripts:
      - name: Install dependencies
        script: |
          pip install --upgrade pip
          pip install --upgrade flet
          pip install -r requirements.txt
      - name: Build IOS App Package
        script: |
          # Compiles your Python folder into an iOS package without App Store publishing locks
          yes y | flet build ipa . --info-plist NSCameraUsageDescription="MacroLens needs your camera to scan meals."
     artifacts:
      - build/ios/ipa/*.ipa
      - build/app/outputs/flutter-ipa/*.ipa
    publishing:
      email:
        recipients:
          - adityamahat743@gmail.com
        notify:
          success: true
          failure: true
