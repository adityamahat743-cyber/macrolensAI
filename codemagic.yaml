workflows:
  android-release:
    name: MacroLens - Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      python: 3.12
      flutter: stable  # <-- CRITICAL: Forces Codemagic to load Flutter framework tools
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
      groups:
        - android_signing
    scripts:
      - name: Install dependencies
        script: |
          pip install --upgrade pip
          pip install --upgrade flet
          pip install -r requirements.txt
      - name: Build Android App Bundle
        script: |
          # Build a release package
          flet build appbundle \
            --android-permissions android.permission.CAMERA=true \
            --android-permissions android.permission.RECORD_AUDIO=true \
            main.py
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - adityamahat743@gmail.com   # <-- Update to your real email address
        notify:
          success: true
          failure: true

  ios-release:
    name: MacroLens - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      python: 3.12
      flutter: stable  # <-- CRITICAL: Setup Flutter on macOS environment
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.macrolens
      groups:
        - appstore_credentials
    scripts:
      - name: Install dependencies
        script: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build iOS package
        script: |
          flet build ipa \
            --info-plist NSCameraUsageDescription="MacroLens needs your camera to scan meals." \
            main.py
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true  # <-- Cleaned up user comment string bug
